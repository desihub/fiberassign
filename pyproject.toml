[build-system]
requires = ["setuptools",
            "wheel"]
build-backend = 'setuptools.build_meta'

[project]
name = "fiberassign"
description = "DESI Fiber Assignment Tools"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "DESI Collaboration", email = "desi-data@desi.lbl.gov"},
]
dependencies = [
    "numpy",
    "pyyaml",
    "scipy",
    "matplotlib",
    "astropy",
    "fitsio",
    "desiutil",
    # "desitarget",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/desihub/fiberassign"

[tool.setuptools]
zip-safe = false
include-package-data = true
license-files = ["LICENSE.rst"]

[tool.setuptools.dynamic]
version = {attr = "fiberassign.__version__"}

[tool.setuptools.package-dir]
"" = "py"

[tool.setuptools.packages.find]
where = ["py"]
namespaces = true
exclude = [".github/*"]

[tool.setuptools.package-data]
fiberassign = ["data/*"]

[tool.pytest.ini_options]
norecursedirs = ["bin", "doc", "etc", "old", "src"]

[tool.coverage.report]
omit = ["py/fiberassign/test/*"]
